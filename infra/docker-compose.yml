services:
  postgres:
    image: postgres:15-alpine
    container_name: assistente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: assistente
    volumes:
    - assistente-pg:/var/lib/postgresql/data
    - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
    - assistente-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U assistente
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  redis:
    image: redis:7-alpine
    container_name: assistente-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
    - assistente-redis:/data
    networks:
    - assistente-net
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 256m
  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: assistente-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: https://evo-assistente.natela.exemplo.com
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_TYPE: apikey
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://assistente:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_assistente
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      LOG_LEVEL: ERROR
      LOG_COLOR: 'false'
      DEL_INSTANCE: 'false'
      CONFIG_SESSION_PHONE_CLIENT: Assistente
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: '30'
    volumes:
    - assistente-evolution:/evolution/instances
    networks:
    - assistente-net
    - natelanet
    mem_limit: 1536m
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/ >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
networks:
  assistente-net:
    driver: bridge
  natelanet:
    external: true
    name: natela-control_default
volumes:
  assistente-pg: null
  assistente-redis: null
  assistente-evolution: null
